name: Screenshots

# On-demand screenshot tour for UI review (Actions → Screenshots → Run workflow, or the
# workflow_dispatch API). Builds the debug app, drives it on an API 34 emulator and uploads every
# screen as the artifact "screenshots-<display>-<theme>-font<scale>".
on:
  workflow_dispatch:
    inputs:
      display:
        description: "Screen: phone (~411 dp wide), small (320 dp), tablet (800 dp)"
        type: choice
        options: [phone, small, tablet]
        default: phone
      theme:
        description: "System theme"
        type: choice
        options: [light, dark]
        default: light
      font_scale:
        description: "System font size (1.3 and 2.0 test large text)"
        type: choice
        options: ["1.0", "1.3", "2.0"]
        default: "1.0"
      tests:
        description: "Optional subset, e.g. com.lifeadmin.autopilot.ScreenshotTour#c_taskDetail (empty = everything)"
        type: string
        default: ""

run-name: "Screenshots · ${{ inputs.display }} · ${{ inputs.theme }} · font ${{ inputs.font_scale }}"

permissions:
  contents: read

jobs:
  tour:
    name: Screenshot tour (${{ inputs.display }}, ${{ inputs.theme }}, font ${{ inputs.font_scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Compile before the emulator starts so the two don't compete for the runner's CPUs.
      - name: Build app and test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Same cached AVD snapshot as the instrumented job in android-ci.yml.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run screenshot tour
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY_PROFILE: ${{ inputs.display }}
          THEME: ${{ inputs.theme }}
          FONT_SCALE: ${{ inputs.font_scale }}
          TESTS: ${{ inputs.tests }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Not via connectedDebugAndroidTest: that uninstalls the app (and its screenshots) afterwards.
          script: bash .github/scripts/run-screenshot-tour.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.display }}-${{ inputs.theme }}-font${{ inputs.font_scale }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
