name: Screenshots

# On-demand screenshot tour for UI review. Builds the debug app, drives it on an API 34 emulator
# and uploads every screen as the artifact "screenshots-<display>-<theme>-font<scale>".
# Two ways to start it:
#  - Actions → Screenshots → Run workflow (one variant from the inputs below);
#  - push a change to .github/screenshots-request.json (one or more variants). This is how a
#    coding agent without permission to dispatch workflows requests a run.
on:
  push:
    paths: [ ".github/screenshots-request.json" ]
  workflow_dispatch:
    inputs:
      display:
        description: "Screen: phone (~411 dp wide), small (320 dp), tablet (800 dp)"
        type: choice
        options: [phone, small, tablet]
        default: phone
      theme:
        description: "System theme"
        type: choice
        options: [light, dark]
        default: light
      font_scale:
        description: "System font size (1.3 and 2.0 test large text)"
        type: choice
        options: ["1.0", "1.3", "2.0"]
        default: "1.0"
      tests:
        description: "Optional subset, e.g. com.lifeadmin.autopilot.ScreenshotTour#c_taskDetail (empty = everything)"
        type: string
        default: ""

run-name: "${{ github.event_name == 'push' && 'Screenshots · from request file' || format('Screenshots · {0} · {1} · font {2}', inputs.display, inputs.theme, inputs.font_scale) }}"

permissions:
  contents: read

jobs:
  plan:
    name: Pick variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.pick.outputs.variants }}
      tests: ${{ steps.pick.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          IN_DISPLAY: ${{ inputs.display }}
          IN_THEME: ${{ inputs.theme }}
          IN_FONT: ${{ inputs.font_scale }}
          IN_TESTS: ${{ inputs.tests }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            variants=$(jq -cn --arg d "$IN_DISPLAY" --arg t "$IN_THEME" --arg f "$IN_FONT" '[{display: $d, theme: $t, font_scale: $f}]')
            tests="$IN_TESTS"
          else
            # At most 6 variants per request; values are validated by the run script.
            variants=$(jq -c '[.variants[:6][] | {display: (.display // "phone"), theme: (.theme // "light"), font_scale: ((.font_scale // "1.0") | tostring)}]' .github/screenshots-request.json)
            tests=$(jq -r '.tests // ""' .github/screenshots-request.json)
          fi
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Variants: $variants  Tests: ${tests:-all}"

  tour:
    name: Screenshot tour (${{ matrix.v.display }}, ${{ matrix.v.theme }}, font ${{ matrix.v.font_scale }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Compile before the emulator starts so the two don't compete for the runner's CPUs.
      - name: Build app and test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Same cached AVD snapshot as the instrumented job in android-ci.yml.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run screenshot tour
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY_PROFILE: ${{ matrix.v.display }}
          THEME: ${{ matrix.v.theme }}
          FONT_SCALE: ${{ matrix.v.font_scale }}
          TESTS: ${{ needs.plan.outputs.tests }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Not via connectedDebugAndroidTest: that uninstalls the app (and its screenshots) afterwards.
          script: bash .github/scripts/run-screenshot-tour.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.v.display }}-${{ matrix.v.theme }}-font${{ matrix.v.font_scale }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
