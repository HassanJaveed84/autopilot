name: Android CI

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "**/*.md", ".github/screenshots-request.json" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit/Robolectric tests, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The personal signing key (see app/build.gradle.kts) keeps installs updatable. Forks and
      # repos without the secret fall back to the debug key.
      - name: Restore the personal signing key
        env:
          KEYSTORE_B64: ${{ secrets.AUTOPILOT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore && echo "$KEYSTORE_B64" | base64 -d > keystore/personal.jks
            echo "Signing with the personal key."
          else
            echo "No AUTOPILOT_KEYSTORE_B64 secret: signing with the debug key (a fresh one on every run)."
          fi
      - name: Build and test
        env:
          AUTOPILOT_KEYSTORE_PASSWORD: ${{ secrets.AUTOPILOT_KEYSTORE_PASSWORD }}
        run: ./gradlew --stacktrace lintDebug testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      # App Link spike: the assetlinks.json statement for the certificate this release APK is really
      # signed with (public digest only). Without the personal-key secret it describes a throwaway key.
      - name: Release signing certificate for assetlinks.json
        run: |
          set -o pipefail
          applink-site/assetlinks-from-apk.sh app/build/outputs/apk/release/app-release.apk | tee assetlinks.json
          { echo '### assetlinks.json for this release APK'; echo '```json'; cat assetlinks.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: assetlinks.json
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Compile before the emulator starts: compiling while it runs competes for the runner's
      # CPUs (run #19 spent ~11 min there). The emulator step then reuses this warm daemon.
      - name: Build app and test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest
      # AVD snapshot cache (pattern documented by reactivecircus/android-emulator-runner): the
      # first run creates and caches a booted snapshot; later runs boot from it, which avoids most
      # of the "Timeout waiting for emulator to boot" flakes seen on cold boots.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The screenshot tour runs on demand: .github/workflows/screenshots.yml.
          script: ./gradlew --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.lifeadmin.autopilot.ScreenshotTour,com.lifeadmin.autopilot.ScreenshotTourAiReview
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
